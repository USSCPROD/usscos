# USSCOS — internal application
# /etc/nginx/sites-available/os.usscos.com
#
# certbot --nginx rewrites this to add the TLS block and the port 80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name os.usscos.com;

    root /var/www/usscos/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                  always;

    # Front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Uploaded files are data, never code. Nothing in here may execute.
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }
    }

    # Long cache on static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles or backups
    location ~ /\.(?!well-known) { deny all; }
    location ~ ~$             { deny all; }

    access_log /var/log/nginx/os.usscos.com.access.log;
    error_log  /var/log/nginx/os.usscos.com.error.log;
}
