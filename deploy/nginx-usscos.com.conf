# usscos.com — public website and lead capture forms
# /etc/nginx/sites-available/usscos.com

server {
    listen 80;
    listen [::]:80;
    server_name usscos.com www.usscos.com;

    root /var/www/usscos.com;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;   # stencil artwork uploads

    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Customer-submitted artwork — downloadable, never executable
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/usscos.com.access.log;
    error_log  /var/log/nginx/usscos.com.error.log;
}
